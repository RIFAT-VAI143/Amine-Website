<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime X Hub - Stream Anime Free</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">🎬</span>
                <span class="logo-text">Anime X Hub</span>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search anime... (naruto, one piece, demon slayer)" class="search-input">
                <button onclick="searchAnime()" class="search-btn">🔍 Search</button>
            </div>
            <div class="nav-links">
                <a href="#" onclick="loadHome()">🏠 Home</a>
                <a href="#" onclick="loadTrending()">🔥 Trending</a>
            </div>
        </div>
    </nav>

    <div class="hero">
        <h1>Anime X Hub</h1>
        <p>Watch thousands of anime episodes in HD quality, completely free</p>
    </div>

    <div class="container">
        <div id="content" class="anime-grid">
            <div class="loading">Loading Anime X Hub...</div>
        </div>
    </div>

    <div id="episodeModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <div id="videoModal" class="modal">
        <div class="modal-content video-modal">
            <span class="close" onclick="closeVideoModal()">&times;</span>
            <div id="videoBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
